name: Build Cordova APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Setup Android SDK
        run: |
          # Встановлюємо робочі папки для Android SDK
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Завантажуємо актуальні command-line tools
          wget -q https://dl.google.com/android/repository/commandline-tools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdtools.zip

          # Додаємо шляхи в систему
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Приймаємо ліцензії та встановлюємо платформи без використання застарілих 'tools'
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create build_app com.ashenrifts.game AshenRifts
          rm -rf build_app/www/*
          cp index.html manifest.json icon-512.png build_app/www/ 2>/dev/null || true
          cd build_app
          cordova platform add android --nosave
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AshenRifts-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
