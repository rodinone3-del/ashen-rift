name: Build Cordova APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create build_app com.ashenrifts.game AshenRifts
          rm -rf build_app/www/*
          cp index.html manifest.json icon-512.png build_app/www/ 2>/dev/null || true
          cd build_app
          cordova platform add android --nosave
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AshenRifts-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
